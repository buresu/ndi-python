[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=3.0.4"]
build-backend = "scikit_build_core.build"

[project]
name = "ndi-python"
version = "6.3.2.6"
description = "Wrapper package for NDI SDK python bindings."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Naoto Kondo", email = "cgigcp3yqt@gmail.com" }]
keywords = ["NDI", "NewTek", "Video Production"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Multimedia",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
    "Topic :: System :: Networking",
]
requires-python = ">=3.11"
dependencies = ["numpy"]

[project.urls]
Homepage = "https://github.com/buresu/ndi-python"

[dependency-groups]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "loopback: sends and receives NDI frames within the process (needs mDNS discovery)",
]

[tool.scikit-build]
wheel.packages = ["src/NDIlib"]

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-* cp315-*"
skip = ["*-musllinux*", "*-win32", "*-manylinux_i686"]
# Loopback tests need mDNS discovery, which CI runners can't be relied on for.
test-requires = ["pytest"]
test-command = 'pytest {project}/tests -m "not loopback" -p no:cacheprovider'
# Emulated architectures run the tests too slowly to be worth it.
test-skip = "*-*linux_{aarch64,armv7l}"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64", "armv7l"]
repair-wheel-command = "auditwheel repair --exclude libavahi-common.so.3 --exclude libavahi-client.so.3 -w {dest_dir} {wheel}"
# Avahi is left out of the wheel, so the system has to provide it.
before-test = "yum install -y avahi-libs"

[tool.cibuildwheel.macos]
archs = ["arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "13.0" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]
# CMake already bundles the NDI DLL beside the extension module.
repair-wheel-command = ""
